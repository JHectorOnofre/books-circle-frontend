<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookCircle - Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Premium Custom Styles (skill.md rules) -->
    <link href="./css/premium.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/knockout/3.5.1/knockout-latest.debug.js" integrity="sha512-per7WBYe3cT9aIDMoF74rYR7wpEDPqyncWqWzBGmJBnhp8H3ZD5fRdTM16IO5ePUEuBlH9DMKF7rHvuazhvDBA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <!--03  <ko.validation-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/knockout-validation/2.0.4/knockout.validation.min.js"></script>
    <!--04  <ko.validation-->
    <script src="./blockui.js"></script>
</head>

<body id="wrapper">

    <main class="bc-split-layout">
        <!-- Left Side: Form Content -->
        <section class="bc-split-content animate-fade-up">
            <div class="mb-5">
                <span class="bc-badge mb-3">Welcome to BookCircle</span>
                <h1 class="display-5 fw-bold text-dark">Join the club.</h1>
                <p class="text-muted-bc fs-5 mt-2">Sign in to coordinate reading groups, vote on your next book, and share progress with friends.</p>
            </div>

            <!-- Login Form mapped to /token -->
            <form id="loginForm" class="bc-surface bc-surface-sm delay-100">
                <h2 class="bc-section-title" data-bind="text: label"></h2>
                
                <div class="bc-form-group">
                    <label for="usernameInput" class="bc-label">Username</label>
                    <input type="text" id="usernameInput" class="bc-input" data-bind="textInput: username" placeholder="Enter your username" required >
                </div>

                <div class="bc-form-group mb-4">
                    <label for="passwordInput" class="bc-label">Password</label>
                    <input type="password" id="passwordInput" class="bc-input" data-bind="textInput: password" placeholder="Enter your password" required >
                </div>

                <div class="d-grid mt-2">
                    <!-- Button has visual interaction states mapped in CSS / No desencadena el enviar el formulario a ningún lado: para eso se usa knockout (data-bin)-->
                    <button type="button" class="btn-bc-primary" id="loginBtn" data-bind="click: ClickSignIn">Sign In</button> 
                </div>
                
                <div class="mt-4 text-center">
                    <p class="text-muted-bc small">Don't have an account? 
                        <a href="#" class="text-dark fw-bold text-decoration-none" id="toggleRegister" data-bind="click: CreateAccount">Create one</a>
                    </p>
                </div>

                <!-- Alert container for error states -->
                <div data-bind="if: has_error">
                    <div id="loginAlert" class="alert alert-danger mt-3" role="alert" >
                        <span data-bind="text: error"></span>
                    </div>
                </div>

            </form>

            <!-- Register Form mapped to /auth/register (Hidden by default for JS toggling later) -->
            <form id="registerForm" class="bc-surface bc-surface-sm delay-200 mt-4 d-none" >
                <h2 class="bc-section-title" >Register</h2>
                
                <div class="bc-form-group">
                    <label for="regFullName" class="bc-label">Full Name</label>
                    <input type="text" id="regFullName" class="bc-input" placeholder="Jane Doe" required >
                </div>
                <div class="bc-form-group">
                    <label for="regEmail" class="bc-label">Email</label>
                    <input type="email" id="regEmail" class="bc-input" placeholder="jane@example.com" required >
                </div>
                <div class="bc-form-group">
                    <label for="regUsername" class="bc-label">Username</label>
                    <input type="text" id="regUsername" class="bc-input" placeholder="janedoe99" required >
                </div>
                <div class="bc-form-group mb-4">
                    <label for="regPassword" class="bc-label">Password</label>
                    <input type="password" id="regPassword" class="bc-input" placeholder="Minimum 8 characters" required >
                </div>

                <div class="d-grid mt-2">
                    <button type="submit" class="btn-bc-accent" id="registerBtn" >Create Account</button>
                </div>
                
                <div class="mt-4 text-center">
                    <p class="text-muted-bc small">Already have an account? <a href="#" class="text-dark fw-bold text-decoration-none" id="toggleLogin">Sign in</a></p>
                </div>
            </form>

        </section>

        <!-- Right Side: Graphic Asset (Anti-center bias, asymmetrical layout) -->
        <!-- Will use an absolute reliable placeholder until integrated -->
        <section class="bc-split-asset">
            <img src="https://picsum.photos/seed/bookcircle/1200/1600" alt="Abstract interior illustrating a peaceful reading space (placeholder)">
        </section>

    </main>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- 
      TEACHING NOTE:
      The form above contains standard ID attributes (e.g. `id="loginForm"`, `id="usernameInput"`) for Vanilla JS traversal.
      It ALSO contains `data-bind` attributes (e.g. `data-bind="value: loginUsername"`) for Knockout.js ViewModel binding.
      Students can attach the Javascript script of their choice below to bring the UI to life based on the `/token` and `/auth/register` endpoints.
    -->
    <!-- <script src="./js/vanilla/login.js"></script> -->
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/knockout/3.5.1/knockout-latest.js"></script> -->
    <!-- <script src="./js/ko/LoginViewModel.js"></script> -->

    <script> 

        // MVVM

        ko.validation.init({
            registerExtenders: true, 
            messagesOnModified: true, // muestra los mensajes de error conforme el usuario avance en el formulario
            insertMessages: true, 
            errorElementClass: 'intput-validation-error', // clase a la que se le inyecta el elemento que muestra el error
            decorateElementOnModified: true
        });

        function UserLogin(data){ // Ubicación??
            var self = this;
            self.username = ko.observable(data.username);
            self.password = ko.observable(data.username);
        }

        function UserLoginViewModel(){
            var self = this;            
            self.label = ko.observable('Book Circle Login');
            self.username = ko.observable('').extend({ required: true}); // username se vuelve de variable a función dado el observable
            self.password = ko.observable('').extend({ required: true});
            self.error = ko.observable();
            console.log(this)
            self.has_error = ko.computed(() => { // computed funciona como un observable pero se puede evaluar en este caso una función:
                if(this.error() != undefined) {return true;} // != entonces se infiere que hay un error
                return false;
            });
            /*
            self.grouperror.errors = ko.validatedObservable({
                username: self.username,
                password: self.password,
            }); video3 min 12:35*/
            

            self.Init()
        }


        UserLoginViewModel.prototype.Init = function() {
            console.log("Welcome to BookCircle");
        };


        UserLoginViewModel.prototype.CreateAccount = function (first_argument) {
            var formLogin = $('#loginForm');
            var formRegister = $('#registerForm');

            formLogin.fadeOut('fast', (data) => {
                formRegister.removeClass('d-none').hide().fadeIn('slow');
            });

        };


        // función que representa el clic del botón "Sign In" Por medio de los data-bin 
        UserLoginViewModel.prototype.ClickSignIn = function()  {
            $.blockUI({messsage:null});
            // 04 crear grupo de validación en el cual el validation capte atm los errores de todo el ViewModel (todos los observables que tengan validación)
            var erros = ko.validation.group(this);
            if (errors().length > 0) {
                errors.showAllMessages();
                return;
            }
            // if(!this.username.isValid()) {
            //     //this.grouperror.showAllMessages();
            //     return;
            // }

            // if(!this.password.isValid()) {return;}

            // petición AJAX desde el this
            $.ajax({
                url : 'https://localhost:7196/token',
                method : 'POST',
                data : {
                "username": this.username(),
                "password": this.password()
                //"password": "PjZtTEdqXLVOGh4"
                }
            }).done((data) => {  // métodos encadenados mediante una función anónima / .done() regresa un objeto 
                console.log(data.accessToken)
                alert('ok')
                $.unblockUI();
                
                localStorage.setItem('token', data.accessToken);
                
            }).fail((data)=> {
                var message = data.responseJSON.detail;
                // console.log(this.error())
                // console.log(this.has_error())
                this.error(message);
                $.unblockUI();
                // console.log(this.error())
                // console.log(this.has_error())
            });

        };

        ko.applyBindings(new UserLoginViewModel(), document.getElementById('wrapper'))

    </script>

</body>
</html>
