<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookCircle</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Premium Styles -->
  <link href="./css/premium.css" rel="stylesheet" />
</head>
<body>

  <!-- ══════════════════════════════════════════════════════
       SHELL  –  Persistent navbar (hidden on login view)
  ══════════════════════════════════════════════════════ -->
  <nav class="bc-navbar animate-fade-up" id="shell-nav" style="display:none;">
    <div class="bc-container d-flex justify-content-between align-items-center py-0" style="height:64px;">
      <div class="d-flex align-items-center gap-4">
        <a class="navbar-brand" href="#clubs" id="nav-logo">BookCircle</a>
        <nav aria-label="breadcrumb" id="nav-breadcrumb" class="d-none d-md-flex align-items-center mt-1">
          <!-- Populated dynamically -->
        </nav>
      </div>
      <div class="d-flex align-items-center gap-3">
        <span class="text-muted-bc fw-medium d-none d-md-inline small" id="nav-greeting"></span>
        <button class="btn-bc-outline btn-sm" id="nav-logout-btn">Logout</button>
      </div>
    </div>
  </nav>

  <!-- ══════════════════════════════════════════════════════
       SPA MAIN – Views are rendered here by app.js
  ══════════════════════════════════════════════════════ -->
  <div id="spa-main" class="animate-fade-up"></div>


  <!-- ╔══════════════════════════════════════════════════════╗
       ║  VIEW TEMPLATES (inert until cloned by app.js)      ║
       ╚══════════════════════════════════════════════════════╝ -->


  <!-- ═══════════════════════════════
       VIEW: login
  ════════════════════════════════ -->
  <template data-view="login">
    <main class="bc-split-layout">
      <!-- Left: Form -->
      <section class="bc-split-content">

        <div class="mb-5">
          <span class="bc-badge mb-3">Welcome to BookCircle</span>
          <h1 class="display-5 fw-bold text-dark">Join the club.</h1>
          <p class="text-muted-bc fs-5 mt-2">
            Sign in to coordinate reading groups, vote on your next book, and share progress with friends.
          </p>
        </div>

        <!-- Sign-in form -->
        <div data-bind="visible: !isRegister()" class="bc-surface bc-surface-sm delay-100">
          <h2 class="bc-section-title mb-4" data-bind="text: label"></h2>

          <div class="bc-form-group">
            <label class="bc-label">Username</label>
            <input type="text" class="bc-input" placeholder="Enter your username"
                   data-bind="textInput: username" />
          </div>

          <div class="bc-form-group mb-4">
            <label class="bc-label">Password</label>
            <input type="password" class="bc-input" placeholder="Enter your password"
                   data-bind="textInput: password" />
          </div>

          <!-- Error alert -->
          <div data-bind="if: hasError">
            <div class="alert alert-danger py-2 small" data-bind="text: error"></div>
          </div>

          <div class="d-grid mt-3">
            <button class="btn-bc-primary" data-bind="click: signIn, enable: !loading()">
              <span data-bind="visible: !loading()">Sign In</span>
              <span data-bind="visible: loading()">Signing in…</span>
            </button>
          </div>

          <p class="text-muted-bc small text-center mt-4 mb-0">
            Don't have an account?
            <a href="#" class="text-dark fw-bold text-decoration-none"
               data-bind="click: showRegister">Create one</a>
          </p>
        </div>

        <!-- Register form -->
        <div data-bind="visible: isRegister()" class="bc-surface bc-surface-sm delay-100">
          <h2 class="bc-section-title mb-4">Create Account</h2>

          <div class="bc-form-group">
            <label class="bc-label">Full Name</label>
            <input type="text" class="bc-input" placeholder="Jane Doe"
                   data-bind="textInput: fullname" />
          </div>
          <div class="bc-form-group">
            <label class="bc-label">Email</label>
            <input type="email" class="bc-input" placeholder="jane@example.com"
                   data-bind="textInput: email" />
          </div>
          <div class="bc-form-group">
            <label class="bc-label">Username</label>
            <input type="text" class="bc-input" placeholder="janedoe99"
                   data-bind="textInput: username2" />
          </div>
          <div class="bc-form-group mb-4">
            <label class="bc-label">Password</label>
            <input type="password" class="bc-input" placeholder="Minimum 8 characters"
                   data-bind="textInput: password2" />
          </div>

          <!-- Error alert -->
          <div data-bind="if: hasError">
            <div class="alert alert-danger py-2 small" data-bind="text: error"></div>
          </div>

          <div class="d-grid mt-2">
            <button class="btn-bc-accent" data-bind="click: createAccount, enable: !loading()">
              <span data-bind="visible: !loading()">Create Account</span>
              <span data-bind="visible: loading()">Creating…</span>
            </button>
          </div>

          <p class="text-muted-bc small text-center mt-4 mb-0">
            Already have an account?
            <a href="#" class="text-dark fw-bold text-decoration-none"
               data-bind="click: showLogin">Sign in</a>
          </p>
        </div>

      </section>

      <!-- Right: Graphic -->
      <section class="bc-split-asset">
        <img src="https://picsum.photos/seed/bookcircle/1200/1600"
             alt="A peaceful reading space" />
      </section>
    </main>
  </template>


  <!-- ═══════════════════════════════
       VIEW: clubs  (club list)
  ════════════════════════════════ -->
  <template data-view="clubs">
        <strong>Clubs List</strong>
  </template>


  <!-- ══════════════════════════════════════════════════════
       SCRIPTS
  ══════════════════════════════════════════════════════ -->

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- KnockoutJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/knockout/3.5.1/knockout-latest.min.js"></script>

  <!-- KO Validation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/knockout.validation/2.0.4/knockout.validation.min.js"></script>

  <!-- jQuery (used by KO Validation message rendering) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <!-- BookCircle Scripts (order matters) -->
  <script src="./js/api.js"></script>
  <script src="./js/router.js"></script>
  <script src="./js/ko/LoginViewModel.js"></script>
  <!--script src="./js/ko/ClubsViewModel.js"></script-->
  <!--script src="./js/ko/ClubDetailViewModel.js"></script-->
  <script src="./js/app.js"></script>

  <!-- ── Shell init: navbar + breadcrumbs + KO Validation config ── -->
  <script>
    // KO Validation global config
    ko.validation.init({
      registerExtenders:      true,
      messagesOnModified:     true,
      insertMessages:         true,
      errorElementClass:      'input-validation-error',
      decorateElementOnModified: true,
    });

    // ── Shell navbar ──────────────────────────────────────────
    const shellNav      = document.getElementById('shell-nav');
    const navGreeting   = document.getElementById('nav-greeting');
    const navBreadcrumb = document.getElementById('nav-breadcrumb');
    const navLogoutBtn  = document.getElementById('nav-logout-btn');

    navLogoutBtn.addEventListener('click', () => Api.logout());

    /**
     * Show/hide the shell navbar and update breadcrumbs.
     * Called by the Router after each navigation.
     */
    function updateShell(route, params) {
      const isLogin = route === 'login';
      shellNav.style.display = isLogin ? 'none' : '';

      navBreadcrumb.innerHTML = '';

      if (route === 'clubs') {
        navBreadcrumb.innerHTML =
          `<ol class="breadcrumb mb-0">
             <li class="breadcrumb-item active fw-medium text-dark" aria-current="page">Clubs</li>
           </ol>`;
      }

      // inyección del html para 'club', con innerHTML sustituyendo un elemento para inyectar el template posteriormente marcado
      if (route === 'club') {
        navBreadcrumb.innerHTML =
          `<ol class="breadcrumb mb-0">
             <li class="breadcrumb-item">
               <a href="#clubs" class="text-decoration-none text-muted-bc">Clubs</a>
             </li>
             <li class="breadcrumb-item active text-dark fw-medium" id="bc-club-name" aria-current="page">
               Loading…
             </li>
           </ol>`;
      }
    }

    // Patch Router.on to also update shell
    const _origOn = Router.on.bind(Router);
    const _routeHandlers = {};

    Router.on = function(route, handler) {
      _origOn(route, async (params) => {
        updateShell(route, params);
        await handler(params);

        // After club detail binds, watch for name change to update breadcrumb
        if (route === 'club') {
          const nameEl = document.getElementById('bc-club-name');
          if (nameEl) {
            const spaMain = document.getElementById('spa-main');
            const vm = ko.dataFor(spaMain.firstElementChild);
            if (vm && vm.clubName) {
              ko.computed(() => {
                const n = vm.clubName();
                if (nameEl && n) nameEl.textContent = n;
              });
            }
          }
        }
      });
    };
  </script>

</body>
</html>
