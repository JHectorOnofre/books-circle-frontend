<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookCircle SPA</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="./css/premium.css" rel="stylesheet">

    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/knockout/3.5.1/knockout-latest.debug.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-signals/1.0.0/js-signals.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hasher/1.2.0/hasher.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crossroads/0.12.2/crossroads.min.js"></script>

    <!-- Local Libs -->
    <script src="./ko.validation.js"></script>
    <script src="./blockui.js"></script>
</head>


<body id="shell">

    <nav class="bc-navbar py-3 animate-fade-up" data-bind="visible: currentComponent() !== 'login'">
        <div class="bc-container d-flex justify-content-between align-items-center py-0">
            <a class="navbar-brand fw-bold fs-4 text-dark" href="#clubs">
                BookCircle
            </a>
            <div class="d-flex align-items-center gap-3">
                <span class="text-muted-bc fw-medium d-none d-md-inline"
                    data-bind="text: 'Welcome, ' + currentUser()">Welcome, User</span>
                <button class="btn-bc-outline btn-sm" data-bind="click: logout">Logout</button>
            </div>
        </div>
    </nav>


    <!-- = = = = = = = = = = = = = = = = = = = =
    SPA Container
      - Donde el data-bind estará ligado a un componente (proveniennte del "currentComponent")
      - Al cual se le pueden pasr parámetros a traves del "currentParams"
    = = = = = = = = = = = = = = = = = = = = -->
    <div id="main-content" data-bind="component: { name: currentComponent, params: currentParams }">
    </div>

    <template id="loading-template">
        <div class="d-flex justify-content-center align-items-center" style="height: 50vh;">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </template>
    <script>
        ko.components.register('loading-page', {
            template: { element: 'loading-template' }
        });
    </script>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- App Entry -->
    <script src="./js/api.js"></script> <!-- Concentra las llamadas al servidor -->
    <script src="./js/app.js"></script> <!-- Administrador de los componentes y las rutas (por las cuales se puede acceder a los "/modules") -->
</body>

</html>
